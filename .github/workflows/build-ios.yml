
      - name: Combine Swift diagnostics and Python import tracing
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          # 1. Configure Swift to pass the diagnostics file path to Python.
          swift_path = Path("Sources/PythonConverter.swift")
          swift = swift_path.read_text()

          env_line = 'setenv("PYTHONNOUSERSITE", "1", 1)'
          diagnostic_env = (
              'setenv("MLBB_CONVERTER_DIAGNOSTICS", '
              'outputDirectory.appendingPathComponent("conversion_diagnostics.log").path, 1)'
          )

          if "MLBB_CONVERTER_DIAGNOSTICS" not in swift:
              if env_line not in swift:
                  raise SystemExit(
                      "ERROR: Could not find PYTHONNOUSERSITE in PythonConverter.swift. "
                      "Check the existing Swift Python setup before applying this patch."
                  )
              swift = swift.replace(
                  env_line,
                  env_line + "\n        " + diagnostic_env,
                  1,
              )
              swift_path.write_text(swift)
              print("Added diagnostics environment variable to Swift.")
          else:
              print("Swift diagnostics environment variable already exists.")

          # 2. Trace top-level imports in converter_bridge.py.
          bridge_path = Path("app/converter_bridge.py")
          source = bridge_path.read_text()
          marker = "# MLBB_IOS_IMPORT_DIAGNOSTICS"

          if marker not in source:
              tree = ast.parse(source)
              lines = source.splitlines()

              # Insert trace calls before imports, working backwards so
              # the original line numbers remain valid.
              for node in sorted(tree.body, key=lambda n: n.lineno, reverse=True):
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      if (
                          isinstance(node, ast.ImportFrom)
                          and node.module == "__future__"
                      ):
                          continue

                      statement = lines[node.lineno - 1].strip()
                      message = f"before line {node.lineno}: {statement}"
                      lines.insert(node.lineno - 1, f"_ios_diag({message!r})")

              # Reparse after adding trace calls and find a safe insertion
              # point after the module docstring and any future imports.
              updated = "\n".join(lines) + "\n"
              tree = ast.parse(updated)
              insert_after = 0

              for node in tree.body:
                  if (
                      isinstance(node, ast.Expr)
                      and isinstance(node.value, ast.Constant)
                      and isinstance(node.value.value, str)
                      and node.lineno == 1
                  ):
                      insert_after = node.end_lineno
                  elif (
                      isinstance(node, ast.ImportFrom)
                      and node.module == "__future__"
                  ):
                      insert_after = node.end_lineno
                  else:
                      break

              helper = [
                  marker,
                  "import os as _ios_diag_os",
                  "def _ios_diag(message):",
                  "    path = _ios_diag_os.environ.get('MLBB_CONVERTER_DIAGNOSTICS')",
                  "    if not path:",
                  "        return",
                  "    try:",
                  "        with open(path, 'a', encoding='utf-8') as stream:",
                  "            stream.write('PYTHON IMPORT TRACE: ' + message + '\\n')",
                  "            stream.flush()",
                  "    except Exception:",
                  "        pass",
                  "",
              ]

              lines = updated.splitlines()
              lines[insert_after:insert_after] = helper
              updated = "\n".join(lines) + "\n"

              # Fail the build instead of shipping a syntax-broken file.
              ast.parse(updated)
              bridge_path.write_text(updated)
              print("Python import tracing installed.")
          else:
              print("Python import tracing is already installed.")

          # 3. Final syntax check.
          ast.parse(bridge_path.read_text())
          print("Swift diagnostics and Python import tracing are configured.")
          PY
