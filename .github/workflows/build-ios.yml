name: Build MLBB Converter ASTC Update
on:
  push:
    branches: [main, feature/astc-texture-quality]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble project archive
        run: |
          cat MLBB_iOS_Converter_Project.zip.part* > MLBB_iOS_Converter_Project.zip
          unzip -q MLBB_iOS_Converter_Project.zip -d reconstructed
      - name: Build native ARM64 ASTC encoder framework
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 5.7.0 https://github.com/ARM-software/astc-encoder.git /tmp/astc-encoder
          project="reconstructed/MLBB_iOS_Converter"
          source_dir="/tmp/astc-encoder/Source"
          framework="$project/Frameworks/AstcEncoder.framework"
          objects="/tmp/astc-encoder-objects"
          mkdir -p "$framework" "$objects"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          sources=(
            astcenc_averages_and_directions.cpp
            astcenc_block_sizes.cpp
            astcenc_color_quantize.cpp
            astcenc_color_unquantize.cpp
            astcenc_compress_symbolic.cpp
            astcenc_compute_variance.cpp
            astcenc_decompress_symbolic.cpp
            astcenc_diagnostic_trace.cpp
            astcenc_entry.cpp
            astcenc_find_best_partitioning.cpp
            astcenc_ideal_endpoints_and_weights.cpp
            astcenc_image.cpp
            astcenc_integer_sequence.cpp
            astcenc_mathlib.cpp
            astcenc_mathlib_softfloat.cpp
            astcenc_partition_tables.cpp
            astcenc_percentile_tables.cpp
            astcenc_pick_best_endpoint_format.cpp
            astcenc_quantization.cpp
            astcenc_symbolic_physical.cpp
            astcenc_weight_align.cpp
            astcenc_weight_quant_xfer_tables.cpp
          )
          for name in "${sources[@]}"; do
            xcrun --sdk iphoneos clang++ -std=c++14 -O3 -fPIC -fvisibility=hidden -fno-fast-math -ffp-contract=off -pthread -arch arm64 -isysroot "$sdk" -miphoneos-version-min=15.0 -DASTCENC_NEON=1 -DASTCENC_SVE=0 -DASTCENC_SSE=0 -DASTCENC_AVX=0 -DASTCENC_POPCNT=0 -DASTCENC_F16C=0 -I "$source_dir" -c "$source_dir/$name" -o "$objects/${name%.cpp}.o"
          done
          xcrun --sdk iphoneos clang++ -std=c++14 -O3 -fPIC -fvisibility=hidden -fno-fast-math -ffp-contract=off -arch arm64 -isysroot "$sdk" -miphoneos-version-min=15.0 -I "$source_dir" -c patches/astc_encoder_ffi.cpp -o "$objects/astc_encoder_ffi.o"
          xcrun --sdk iphoneos clang++ -dynamiclib -arch arm64 -isysroot "$sdk" -miphoneos-version-min=15.0 -Wl,-install_name,@rpath/AstcEncoder.framework/AstcEncoder -Wl,-dead_strip "$objects"/*.o -o "$framework/AstcEncoder"
          cp /tmp/astc-encoder/LICENSE.txt "$framework/LICENSE-ASTC.txt"
          cat > "$framework/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>AstcEncoder</string>
            <key>CFBundleIdentifier</key><string>com.epichappyboy.mlbb.astcencoder</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>AstcEncoder</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>5.7.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>15.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
          </dict></plist>
          PLIST
          file "$framework/AstcEncoder"
          xcrun --sdk iphoneos nm -gU "$framework/AstcEncoder" | grep -q '_mlbb_astc_encode_rgba'
          echo "Built ARM64 ASTC encoder framework"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project and configure Python extensions
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 scripts/generate_project.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.yml")
          lines = path.read_text().splitlines()
          output = []
          for line in lines:
              output.append(line)
              if line.startswith("      - framework: Frameworks/") and not line.endswith("Python.framework"):
                  output.append("        link: false")
          path.write_text("\n".join(output) + "\n")
          PY
          xcodegen generate
      - name: Fix PythonKit throwing and string conversion
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Sources/PythonConverter.swift")
          source = path.read_text()
          source = source.replace(
              "func convert(input: URL, outputDirectory: URL, completion:",
              "func convert(input: URL, outputDirectory: URL, textureQuality: String, completion:",
              1,
          )
          source = source.replace(
              "bridge.run_conversion.throwing(",
              "bridge.run_conversion.throwing.dynamicallyCall(withArguments: [",
          )
          source = source.replace(
              "input.lastPathComponent\n                )",
              "input.lastPathComponent,\n                    textureQuality\n                ])",
          )
          source = source.replace(
              "let jsonText = try raw.as(String.self)",
              "let jsonText = String(raw) ?? raw.description",
          )
          source = source.replace(
              "                try self.initializeRuntime()",
              "                self.recordDiagnostic(\"SWIFT: Python runtime initialization started\", outputDirectory: outputDirectory)\n                try self.initializeRuntime()\n                self.recordDiagnostic(\"SWIFT: Python runtime initialized\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "                try self.initializeRuntime()",
              "                try self.initializeRuntime(outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        PythonLibrary.useVersion(3, 14)",
              "        self.recordDiagnostic(\"SWIFT: selecting embedded Python 3.14\", outputDirectory: outputDirectory)\n        PythonLibrary.useVersion(3, 14)\n        self.recordDiagnostic(\"SWIFT: Python 3.14 selected\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        let pythonLibrary = appRoot.appendingPathComponent(\"Frameworks/Python.framework/Python\").path",
              "        let pythonLibrary = appRoot.appendingPathComponent(\"Frameworks/Python.framework/Python\").path\n        guard FileManager.default.fileExists(atPath: pythonLibrary) else {\n            throw ConverterError.conversionFailed(\"Nawawala ang embedded Python framework: \\(pythonLibrary)\")\n        }\n        guard FileManager.default.fileExists(atPath: pythonRoot.appendingPathComponent(\"lib/python3.14\", isDirectory: true).path) else {\n            throw ConverterError.conversionFailed(\"Nawawala ang Python 3.14 standard library sa app bundle.\")\n        }\n        if dlopen(pythonLibrary, RTLD_LAZY | RTLD_GLOBAL) == nil {\n            let reason = dlerror().map { String(cString: $0) } ?? \"unknown dynamic-loader error\"\n            self.recordDiagnostic(\"SWIFT: Python framework load failed: \\(reason)\", outputDirectory: outputDirectory)\n            throw ConverterError.conversionFailed(\"Hindi ma-load ang embedded Python framework: \\(reason)\")\n        }\n        self.recordDiagnostic(\"SWIFT: Python framework and standard library files exist\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        setenv(\"PYTHONPATH\", \"\\(appRoot.appendingPathComponent(\"app\").path):\\(appRoot.appendingPathComponent(\"app_packages\").path)\", 1)",
              "        let standardLibrary = pythonRoot.appendingPathComponent(\"lib/python3.14\").path\n        let dynamicModules = standardLibrary + \"/lib-dynload\"\n        let applicationPath = appRoot.appendingPathComponent(\"app\").path\n        let packagesPath = appRoot.appendingPathComponent(\"app_packages\").path\n        setenv(\"PYTHONPATH\", [standardLibrary, dynamicModules, applicationPath, packagesPath].joined(separator: \":\"), 1)\n        setenv(\"PYTHONUTF8\", \"1\", 1)\n        setenv(\"PYTHONUNBUFFERED\", \"1\", 1)\n        setenv(\"PYTHONDONTWRITEBYTECODE\", \"1\", 1)\n        setenv(\"PYTHONNOUSERSITE\", \"1\", 1)",
              1,
          )
          source = source.replace(
              "        PythonLibrary.useLibrary(at: pythonLibrary)",
              "        self.recordDiagnostic(\"SWIFT: loading embedded Python framework\", outputDirectory: outputDirectory)\n        PythonLibrary.useLibrary(at: pythonLibrary)\n        self.recordDiagnostic(\"SWIFT: embedded Python framework loaded\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        _ = Python.import(\"sys\")",
              "        self.recordDiagnostic(\"SWIFT: initializing Python interpreter by importing sys\", outputDirectory: outputDirectory)\n        _ = Python.import(\"sys\")\n        self.recordDiagnostic(\"SWIFT: Python sys import completed\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "                let sys = Python.import(\"sys\")",
              "                self.recordDiagnostic(\"SWIFT: importing Python sys module\", outputDirectory: outputDirectory)\n                let sys = Python.import(\"sys\")",
              1,
          )
          source = source.replace(
              "                let bridge = Python.import(\"converter_bridge\")",
              "                self.recordDiagnostic(\"SWIFT: importing converter bridge and Unity dependencies\", outputDirectory: outputDirectory)\n                let bridge = Python.import(\"converter_bridge\")\n                self.recordDiagnostic(\"SWIFT: converter bridge imported\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "                let raw = try bridge.run_conversion.throwing.dynamicallyCall(withArguments: [",
              "                self.recordDiagnostic(\"SWIFT: calling Python conversion function\", outputDirectory: outputDirectory)\n                let raw = try bridge.run_conversion.throwing.dynamicallyCall(withArguments: [",
              1,
          )
          source = source.replace(
              "                let jsonText = String(raw) ?? raw.description",
              "                self.recordDiagnostic(\"SWIFT: Python conversion returned\", outputDirectory: outputDirectory)\n                let jsonText = String(raw) ?? raw.description",
              1,
          )
          source = source.replace(
              "                completion(.failure(error))",
              "                self.recordDiagnostic(\"SWIFT: conversion failed: \\(error.localizedDescription)\", outputDirectory: outputDirectory)\n                completion(.failure(error))",
              1,
          )
          recorder = '''
              private func recordDiagnostic(_ message: String, outputDirectory: URL) {
                  let file = outputDirectory.appendingPathComponent("conversion_diagnostics.log")
                  let line = "\\(ISO8601DateFormatter().string(from: Date())) \\(message)\\n"
                  guard let data = line.data(using: .utf8) else { return }
                  if let handle = try? FileHandle(forWritingTo: file) {
                      try? handle.seekToEnd()
                      try? handle.write(contentsOf: data)
                      try? handle.close()
                  } else {
                      try? data.write(to: file, options: .atomic)
                  }
              }

          '''
          if "private func recordDiagnostic(_ message: String, outputDirectory: URL)" not in source:
              source = source.replace("    private func initializeRuntime() throws {", recorder + "    private func initializeRuntime(outputDirectory: URL) throws {")
          if source.count("recordDiagnostic(") < 7:
              raise SystemExit("Could not add iOS-to-Python diagnostic checkpoints")
          for required in ("let dynamicModules =", "Python framework and standard library files exist", "PYTHONDONTWRITEBYTECODE"):
              if required not in source:
                  raise SystemExit(f"Could not configure safe embedded Python startup: {required}")
          for checkpoint in ("Python 3.14 selected", "embedded Python framework loaded", "Python sys import completed"):
              if checkpoint not in source:
                  raise SystemExit(f"Could not add Python runtime checkpoint: {checkpoint}")
          if "initializeRuntime(outputDirectory: outputDirectory)" not in source or "initializeRuntime(outputDirectory: URL)" not in source:
              raise SystemExit("Could not pass the diagnostics path into Python runtime setup")
          if "dynamicallyCall(withArguments:" not in source or "raw.as(String.self)" in source:
              raise SystemExit("Could not patch PythonKit calls")
          path.write_text(source)
          PY
      - name: Add direct Files import handling
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          cp ../../patches/MLBBConverterApp.swift Sources/MLBBConverterApp.swift
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path("Sources/Info.plist")
          data = plistlib.loads(path.read_bytes())
          if data.get("CFBundleIdentifier") != "com.codex.mlbbconverter":
              raise SystemExit("Refusing to change the existing MLBB Converter bundle identifier")
          data["CFBundleShortVersionString"] = "1.1"
          data["CFBundleVersion"] = "2"
          for document_type in data.get("CFBundleDocumentTypes", []):
              document_type["CFBundleTypeRole"] = "Editor"
              document_type["LSHandlerRank"] = "Alternate"
              document_type["LSItemContentTypes"] = ["public.zip-archive", "com.codex.unity3d"]
          path.write_bytes(plistlib.dumps(data))
          PY
      - name: Reduce conversion memory on iPhone
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          converter = Path("app/converter_bridge.py")
          source = converter.read_text()
          old_options = "ConvertOptions(create_zip=True, full_validation=True, strict_matching=True, preserve_shadows=True)"
          new_options = "ConvertOptions(create_zip=True, full_validation=False, strict_matching=True, preserve_shadows=True)"
          if old_options not in source:
              raise SystemExit("Could not find the iOS conversion options")
          source = source.replace(old_options, new_options, 1)
          converter.write_text(source)
          converter_module = Path("app/mlbb_ios_converter.py")
          module_source = converter_module.read_text()
          if "compresslevel=9" not in module_source:
              raise SystemExit("Could not find the output ZIP compression setting")
          converter_module.write_text(module_source.replace("compresslevel=9", "compresslevel=1", 1))
          PY
      - name: Preserve ASTC textures and record conversion diagnostics
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("app/converter_bridge.py")
          source = bridge.read_text()
          if "from datetime import datetime" not in source:
              source = source.replace("from contextlib import redirect_stderr, redirect_stdout", "from contextlib import redirect_stderr, redirect_stdout\nfrom datetime import datetime", 1)
          source = source.replace(
              "    output_dir = output_zip = None\n    try:\n        parent = Path(output_path)\n        parent.mkdir(parents=True, exist_ok=True)",
              "    output_dir = output_zip = None\n    parent = Path(output_path)\n    parent.mkdir(parents=True, exist_ok=True)\n    diagnostic = parent / \"conversion_diagnostics.log\"\n    def record(message):\n        logs.append(message)\n        if message.startswith((\"[\", \"Extracting\", \"Found \", \"Validating\", \"Validation\", \"WARNING\", \"Starting bundle\", \"Finished bundle\", \"=== RESULT:\")):\n            try:\n                with diagnostic.open(\"a\", encoding=\"utf-8\") as stream:\n                    stream.write(f\"{datetime.now().isoformat(timespec='seconds')} {message}\\n\")\n                    stream.flush()\n            except OSError:\n                pass\n    try:",
              1,
          )
          source = source.replace("logger=logs.append,\n                progress=lambda value, message: logs.append(f\"[{value:.0f}%] {message}\"))", "logger=record,\n                progress=lambda value, message: record(f\"[{value:.0f}%] {message}\"))", 1)
          source = source.replace("        final_zip = _unique_zip(parent, _output_stem(display_name))", "        record(\"=== RESULT: SUCCESS ===\")\n        final_zip = _unique_zip(parent, _output_stem(display_name))", 1)
          source = source.replace("        logs.append(traceback.format_exc(limit=8))", "        trace = traceback.format_exc(limit=8)\n        logs.append(trace)\n        try:\n            with diagnostic.open(\"a\", encoding=\"utf-8\") as stream:\n                stream.write(f\"{datetime.now().isoformat(timespec='seconds')} === RESULT: ERROR === {exc}\\n{trace}\\n\")\n                stream.flush()\n        except OSError:\n            pass", 1)
          if "logger=record" not in source or "=== RESULT: SUCCESS ===" not in source:
              raise SystemExit("Could not add persistent conversion diagnostics")
          bridge.write_text(source)

          converter = Path("app/mlbb_ios_converter.py")
          module = converter.read_text()
          if "Starting bundle" not in module:
              module = module.replace(
                  "                    self._convert_bundle(source, target)\n                    self.jobs.append((source, target))",
                  "                    self.log(f\"Starting bundle {number}/{len(sources)}: {source.name}\")\n                    self._convert_bundle(source, target)\n                    gc.collect()\n                    self.log(f\"Finished bundle {number}/{len(sources)}: {source.name}\")\n                    self.jobs.append((source, target))",
                  1,
              )
          # Do not skip existing ASTC textures. The converter must decode every eligible
          # source texture and re-encode it using the selected ASTC block size.
          converter.write_text(module)

          # Install the lazy-import bridge last so earlier compatibility patches
          # cannot overwrite the crash fix.
          patched_bridge = Path("../../patches/converter_bridge.py")
          if not patched_bridge.is_file():
              raise SystemExit("Missing patches/converter_bridge.py")
          bridge.write_text(patched_bridge.read_text())
          PY
      - name: Apply ASTC texture quality formats
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          converter = Path("app/mlbb_ios_converter.py")
          source = converter.read_text()

          options_line = '    preserve_shadows: bool = True\n'
          quality_line = '    texture_quality: str = "balanced"\n'
          if quality_line.rstrip("\n") not in source:
              if options_line not in source:
                  raise SystemExit("Could not find ConvertOptions fields")
              source = source.replace(options_line, options_line + quality_line, 1)

          target_pattern = re.compile(r'(?m)^(?P<indent>[ \t]*)target_format=TextureFormat\.RGBA32,$')
          def target_replacement(match):
              indent = match.group("indent")
              return (
                  indent + "target_format={\n"
                  + indent + '    "high": TextureFormat.ASTC_RGBA_4x4,\n'
                  + indent + '    "balanced": TextureFormat.ASTC_RGBA_6x6,\n'
                  + indent + '    "small": TextureFormat.ASTC_RGBA_8x8,\n'
                  + indent + "}[self.options.texture_quality],"
              )
          source, target_count = target_pattern.subn(target_replacement, source, count=1)
          if target_count != 1 and "TextureFormat.ASTC_RGBA_6x6" not in source:
              raise SystemExit("Could not connect ASTC target formats to Texture2D conversion")

          old_validation = "\\n".join([
              "                    if int(texture.m_TextureFormat) != int(TextureFormat.RGBA32):",
              "                        raise ConversionError(f\\\"Texture is not RGBA32: {texture.m_Name}\\\")",
          ])
          new_validation = "\\n".join([
              "                    expected_texture_format = {",
              '                        "high": TextureFormat.ASTC_RGBA_4x4,',
              '                        "balanced": TextureFormat.ASTC_RGBA_6x6,',
              '                        "small": TextureFormat.ASTC_RGBA_8x8,',
              "                    }[self.options.texture_quality]",
              "                    if int(texture.m_TextureFormat) != int(expected_texture_format):",
              '                        raise ConversionError(f"Texture is not in selected ASTC format ({self.options.texture_quality}): {texture.m_Name}")',
          ])
          if old_validation in source:
              source = source.replace(old_validation, new_validation, 1)
          elif new_validation not in source:
              raise SystemExit("Could not update texture validation for selected ASTC format")

          if quality_line.rstrip("\n") not in source or "ASTC_RGBA_6x6" not in source:
              raise SystemExit("ASTC quality configuration was not applied")
          converter.write_text(source)
          PY
      - name: Build unsigned iPhone app
        working-directory: reconstructed/MLBB_iOS_Converter
        run: xcodebuild -project MLBBConverter.xcodeproj -scheme MLBBConverter -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Ensure Python standard library is embedded in app bundle
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          app="build/Build/Products/Release-iphoneos/MLBBConverter.app"
          mkdir -p "$app/python"
          ditto python "$app/python"
          test -f "$app/python/lib/python3.14/encodings/__init__.py"
          test -d "$app/python/lib/python3.14/lib-dynload"
          echo "Verified embedded Python standard library at $app/python/lib/python3.14"
      - name: Package IPA
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/MLBBConverter.app package/Payload/
          ditto -c -k --sequesterRsrc --keepParent package/Payload MLBB_Converter_ASTC_Update.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MLBB_Converter_ASTC_Update_unsigned
          path: reconstructed/MLBB_iOS_Converter/MLBB_Converter_ASTC_Update.ipa
          if-no-files-found: error
