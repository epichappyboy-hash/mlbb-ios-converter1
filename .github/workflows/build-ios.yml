name: Build Isha Converter iOS
on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble project archive
        run: |
          cat MLBB_iOS_Converter_Project.zip.part* > MLBB_iOS_Converter_Project.zip
          unzip -q MLBB_iOS_Converter_Project.zip -d reconstructed
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project and configure Python extensions
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 scripts/generate_project.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("project.yml")
          lines = path.read_text().splitlines()
          output = []
          has_target_family = any("TARGETED_DEVICE_FAMILY:" in line for line in lines)
          for line in lines:
              if line.strip().startswith("PRODUCT_BUNDLE_IDENTIFIER:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  output.append(indent + "PRODUCT_BUNDLE_IDENTIFIER: com.isha.converter.ios")
                  continue
              if line.strip().startswith("TARGETED_DEVICE_FAMILY:"):
                  indent = line[:len(line) - len(line.lstrip())]
                  output.append(indent + 'TARGETED_DEVICE_FAMILY: "1,2"')
                  continue
              if line == "name: MLBBConverter":
                  output.append("name: IshaConverteriOS")
                  continue
              if line == "  MLBBConverter:":
                  output.append("  IshaConverteriOS:")
                  continue
              if line == "        PRODUCT_NAME: MLBBConverter":
                  output.append("        PRODUCT_NAME: IshaConverteriOS")
                  output.append("        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon")
                  if not has_target_family:
                      output.append('        TARGETED_DEVICE_FAMILY: "1,2"')
                  continue
              output.append(line)
              if line.startswith("      - framework: Frameworks/") and not line.endswith("Python.framework"):
                  output.append("        link: false")
          path.write_text("\n".join(output) + "\n")
          PY
          icon_dir="Sources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$icon_dir"
          swift ../../scripts/create_isha_icon.swift "$icon_dir/AppIcon.png"
          cat > "$icon_dir/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON
          xcodegen generate
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' IshaConverteriOS.xcodeproj/project.pbxproj || {
            echo "Expected a universal iPhone+iPad target family in the generated project."
            grep -n 'TARGETED_DEVICE_FAMILY' IshaConverteriOS.xcodeproj/project.pbxproj || true
            exit 1
          }
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.isha.converter.ios;' IshaConverteriOS.xcodeproj/project.pbxproj || {
            echo "Expected the new Isha bundle identifier in the generated project."
            grep -n 'PRODUCT_BUNDLE_IDENTIFIER' IshaConverteriOS.xcodeproj/project.pbxproj || true
            exit 1
          }
      - name: Fix PythonKit throwing and string conversion
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Sources/PythonConverter.swift")
          source = path.read_text()
          source = source.replace(
              "bridge.run_conversion.throwing(",
              "bridge.run_conversion.throwing.dynamicallyCall(withArguments: [",
          )
          source = source.replace(
              "input.lastPathComponent\n                )",
              "input.lastPathComponent\n                ])",
          )
          source = source.replace(
              "let jsonText = try raw.as(String.self)",
              "let jsonText = String(raw) ?? raw.description",
          )
          source = source.replace(
              "                try self.initializeRuntime()",
              "                self.recordDiagnostic(\"SWIFT: Python runtime initialization started\", outputDirectory: outputDirectory)\n                try self.initializeRuntime()\n                self.recordDiagnostic(\"SWIFT: Python runtime initialized\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "                try self.initializeRuntime()",
              "                try self.initializeRuntime(outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        PythonLibrary.useVersion(3, 14)",
              "        self.recordDiagnostic(\"SWIFT: selecting embedded Python 3.14\", outputDirectory: outputDirectory)\n        PythonLibrary.useVersion(3, 14)\n        self.recordDiagnostic(\"SWIFT: Python 3.14 selected\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        let pythonLibrary = appRoot.appendingPathComponent(\"Frameworks/Python.framework/Python\").path",
              "        let pythonLibrary = appRoot.appendingPathComponent(\"Frameworks/Python.framework/Python\").path\n        guard FileManager.default.fileExists(atPath: pythonLibrary) else {\n            throw ConverterError.conversionFailed(\"Nawawala ang embedded Python framework: \\(pythonLibrary)\")\n        }\n        guard FileManager.default.fileExists(atPath: pythonRoot.appendingPathComponent(\"lib/python3.14\", isDirectory: true).path) else {\n            throw ConverterError.conversionFailed(\"Nawawala ang Python 3.14 standard library sa app bundle.\")\n        }\n        if dlopen(pythonLibrary, RTLD_LAZY | RTLD_GLOBAL) == nil {\n            let reason = dlerror().map { String(cString: $0) } ?? \"unknown dynamic-loader error\"\n            self.recordDiagnostic(\"SWIFT: Python framework load failed: \\(reason)\", outputDirectory: outputDirectory)\n            throw ConverterError.conversionFailed(\"Hindi ma-load ang embedded Python framework: \\(reason)\")\n        }\n        self.recordDiagnostic(\"SWIFT: Python framework and standard library files exist\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        setenv(\"PYTHONPATH\", \"\\(appRoot.appendingPathComponent(\"app\").path):\\(appRoot.appendingPathComponent(\"app_packages\").path)\", 1)",
              "        let standardLibrary = pythonRoot.appendingPathComponent(\"lib/python3.14\").path\n        let dynamicModules = standardLibrary + \"/lib-dynload\"\n        let applicationPath = appRoot.appendingPathComponent(\"app\").path\n        let packagesPath = appRoot.appendingPathComponent(\"app_packages\").path\n        setenv(\"PYTHONPATH\", [standardLibrary, dynamicModules, applicationPath, packagesPath].joined(separator: \":\"), 1)\n        setenv(\"PYTHONUTF8\", \"1\", 1)\n        setenv(\"PYTHONUNBUFFERED\", \"1\", 1)\n        setenv(\"PYTHONDONTWRITEBYTECODE\", \"1\", 1)\n        setenv(\"PYTHONNOUSERSITE\", \"1\", 1)",
              1,
          )
          source = source.replace(
              "        PythonLibrary.useLibrary(at: pythonLibrary)",
              "        self.recordDiagnostic(\"SWIFT: loading embedded Python framework\", outputDirectory: outputDirectory)\n        PythonLibrary.useLibrary(at: pythonLibrary)\n        self.recordDiagnostic(\"SWIFT: embedded Python framework loaded\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "        _ = Python.import(\"sys\")",
              "        self.recordDiagnostic(\"SWIFT: initializing Python interpreter by importing sys\", outputDirectory: outputDirectory)\n        _ = Python.import(\"sys\")\n        self.recordDiagnostic(\"SWIFT: Python sys import completed\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "                let sys = Python.import(\"sys\")",
              "                self.recordDiagnostic(\"SWIFT: importing Python sys module\", outputDirectory: outputDirectory)\n                let sys = Python.import(\"sys\")",
              1,
          )
          source = source.replace(
              "                let bridge = Python.import(\\\"converter_bridge\\\")",
              "                let bridgePath = appRoot.appendingPathComponent(\\\"app/converter_bridge.py\\\").path\\n                let appPackagesPath = appRoot.appendingPathComponent(\\\"app_packages\\\", isDirectory: true).path\\n                self.recordDiagnostic(\\\"SWIFT: bridge file exists=\\\\(FileManager.default.fileExists(atPath: bridgePath)); path=\\\\(bridgePath)\\\", outputDirectory: outputDirectory)\\n                self.recordDiagnostic(\\\"SWIFT: app_packages exists=\\\\(FileManager.default.fileExists(atPath: appPackagesPath)); path=\\\\(appPackagesPath)\\\", outputDirectory: outputDirectory)\\n                self.recordDiagnostic(\\\"SWIFT: importing converter bridge and Unity dependencies\\\", outputDirectory: outputDirectory)\\n                let bridge = Python.import(\\\"converter_bridge\\\")\\n                self.recordDiagnostic(\\\"SWIFT: converter bridge imported\\\", outputDirectory: outputDirectory)",
              1,
          )
          source = source.replace(
              "                let raw = try bridge.run_conversion.throwing.dynamicallyCall(withArguments: [",
              "                self.recordDiagnostic(\"SWIFT: calling Python conversion function\", outputDirectory: outputDirectory)\n                let raw = try bridge.run_conversion.throwing.dynamicallyCall(withArguments: [",
              1,
          )
          source = source.replace(
              "                let jsonText = String(raw) ?? raw.description",
              "                self.recordDiagnostic(\"SWIFT: Python conversion returned\", outputDirectory: outputDirectory)\n                let jsonText = String(raw) ?? raw.description",
              1,
          )
          failure_replacement = "\n".join([
              "                let failureMessage: String",
              "                if let pythonError = error as? PythonError {",
              "                    switch pythonError {",
              "                    case .exception(let value, _):",
              "                        failureMessage = String(value) ?? \"Python exception (message unavailable).\"",
              "                    case .invalidModule(let name):",
              "                        failureMessage = \"Invalid Python module: \\(name)\"",
              "                    case .invalidCall(let value):",
              "                        failureMessage = \"Invalid Python call: \" + (String(value) ?? \"unknown\")",
              "                    }",
              "                } else {",
              "                    failureMessage = error.localizedDescription",
              "                }",
              "                self.recordDiagnostic(\"SWIFT: conversion failed: \\(failureMessage)\", outputDirectory: outputDirectory)",
              "                completion(.failure(ConverterError.conversionFailed(failureMessage)))",
          ])
          if "                completion(.failure(error))" not in source:
              raise SystemExit("Could not locate conversion error callback")
          source = source.replace(
              "                completion(.failure(error))",
              failure_replacement,
              1,
          )
          recorder = '''
              private func recordDiagnostic(_ message: String, outputDirectory: URL) {
                  let file = outputDirectory.appendingPathComponent("conversion_diagnostics.log")
                  let line = "\\(ISO8601DateFormatter().string(from: Date())) \\(message)\\n"
                  guard let data = line.data(using: .utf8) else { return }
                  if let handle = try? FileHandle(forWritingTo: file) {
                      try? handle.seekToEnd()
                      try? handle.write(contentsOf: data)
                      try? handle.close()
                  } else {
                      try? data.write(to: file, options: .atomic)
                  }
              }

          '''
          if "private func recordDiagnostic(_ message: String, outputDirectory: URL)" not in source:
              source = source.replace("    private func initializeRuntime() throws {", recorder + "    private func initializeRuntime(outputDirectory: URL) throws {")
          if source.count("recordDiagnostic(") < 7:
              raise SystemExit("Could not add iOS-to-Python diagnostic checkpoints")
          for required in ("let dynamicModules =", "Python framework and standard library files exist", "PYTHONDONTWRITEBYTECODE"):
              if required not in source:
                  raise SystemExit(f"Could not configure safe embedded Python startup: {required}")
          for checkpoint in ("Python 3.14 selected", "embedded Python framework loaded", "Python sys import completed"):
              if checkpoint not in source:
                  raise SystemExit(f"Could not add Python runtime checkpoint: {checkpoint}")
          if "initializeRuntime(outputDirectory: outputDirectory)" not in source or "initializeRuntime(outputDirectory: URL)" not in source:
              raise SystemExit("Could not pass the diagnostics path into Python runtime setup")
          if "dynamicallyCall(withArguments:" not in source or "raw.as(String.self)" in source:
              raise SystemExit("Could not patch PythonKit calls")
          path.write_text(source)
          PY
      - name: Add direct Files import handling
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          cp ../../patches/MLBBConverterApp.swift Sources/MLBBConverterApp.swift
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          path = Path("Sources/Info.plist")
          data = plistlib.loads(path.read_bytes())
          data["CFBundleDisplayName"] = "Isha Converter iOS"
          data["CFBundleName"] = "Isha Converter iOS"
          # Use a new bundle ID to force iOS to register this as a fresh app
          # instead of reusing the prior app's cached generic placeholder icon.
          data["CFBundleIdentifier"] = "com.isha.converter.ios"
          data["CFBundleVersion"] = os.environ["GITHUB_RUN_NUMBER"]
          # The archived project's Info.plist contains a stale iPad icon override.
          # Remove icon declarations from the SOURCE plist; Xcode must regenerate
          # CFBundleIcons/CFBundleIcons~ipad from the AppIcon asset catalog.
          data.pop("CFBundleIcons", None)
          data.pop("CFBundleIcons~ipad", None)
          data.pop("CFBundleIconFiles", None)
          data.pop("CFBundleIconName", None)
          for document_type in data.get("CFBundleDocumentTypes", []):
              document_type["CFBundleTypeRole"] = "Editor"
              document_type["LSHandlerRank"] = "Alternate"
              document_type["LSItemContentTypes"] = ["public.zip-archive", "com.codex.unity3d"]
          path.write_bytes(plistlib.dumps(data))
          PY
      - name: Reduce conversion memory on iPhone
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          converter = Path("app/converter_bridge.py")
          source = converter.read_text()
          old_options = "ConvertOptions(create_zip=True, full_validation=True, strict_matching=True, preserve_shadows=True)"
          new_options = "ConvertOptions(create_zip=True, full_validation=False, strict_matching=True, preserve_shadows=True)"
          if old_options not in source:
              raise SystemExit("Could not find the iOS conversion options")
          source = source.replace(old_options, new_options, 1)
          converter.write_text(source)
          converter_module = Path("app/mlbb_ios_converter.py")
          module_source = converter_module.read_text()
          if "compresslevel=9" not in module_source:
              raise SystemExit("Could not find the output ZIP compression setting")
          converter_module.write_text(module_source.replace("compresslevel=9", "compresslevel=1", 1))
          PY
      - name: Preserve ASTC textures and record conversion diagnostics
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("app/converter_bridge.py")
          source = bridge.read_text()
          if "from datetime import datetime" not in source:
              source = source.replace("from contextlib import redirect_stderr, redirect_stdout", "from contextlib import redirect_stderr, redirect_stdout\nfrom datetime import datetime", 1)
          source = source.replace(
              "    output_dir = output_zip = None\n    try:\n        parent = Path(output_path)\n        parent.mkdir(parents=True, exist_ok=True)",
              "    output_dir = output_zip = None\n    parent = Path(output_path)\n    parent.mkdir(parents=True, exist_ok=True)\n    diagnostic = parent / \"conversion_diagnostics.log\"\n    def record(message):\n        logs.append(message)\n        if message.startswith((\"[\", \"Extracting\", \"Found \", \"Validating\", \"Validation\", \"WARNING\", \"Starting bundle\", \"Finished bundle\", \"=== RESULT:\")):\n            try:\n                with diagnostic.open(\"a\", encoding=\"utf-8\") as stream:\n                    stream.write(f\"{datetime.now().isoformat(timespec='seconds')} {message}\\n\")\n                    stream.flush()\n            except OSError:\n                pass\n    try:",
              1,
          )
          source = source.replace("logger=logs.append,\n                progress=lambda value, message: logs.append(f\"[{value:.0f}%] {message}\"))", "logger=record,\n                progress=lambda value, message: record(f\"[{value:.0f}%] {message}\"))", 1)
          source = source.replace("        final_zip = _unique_zip(parent, _output_stem(display_name))", "        record(\"=== RESULT: SUCCESS ===\")\n        final_zip = _unique_zip(parent, _output_stem(display_name))", 1)
          source = source.replace("        logs.append(traceback.format_exc(limit=8))", "        trace = traceback.format_exc(limit=8)\n        logs.append(trace)\n        try:\n            with diagnostic.open(\"a\", encoding=\"utf-8\") as stream:\n                stream.write(f\"{datetime.now().isoformat(timespec='seconds')} === RESULT: ERROR === {exc}\\n{trace}\\n\")\n                stream.flush()\n        except OSError:\n            pass", 1)
          if "logger=record" not in source or "=== RESULT: SUCCESS ===" not in source:
              raise SystemExit("Could not add persistent conversion diagnostics")
          bridge.write_text(source)

          converter = Path("app/mlbb_ios_converter.py")
          module = converter.read_text()
          if "Starting bundle" not in module:
              module = module.replace(
                  "                    self._convert_bundle(source, target)\n                    self.jobs.append((source, target))",
                  "                    self.log(f\"Starting bundle {number}/{len(sources)}: {source.name}\")\n                    self._convert_bundle(source, target)\n                    gc.collect()\n                    self.log(f\"Finished bundle {number}/{len(sources)}: {source.name}\")\n                    self.jobs.append((source, target))",
                  1,
              )
          texture_line = "                    texture = obj.read()\n                    image = texture.image.convert(\"RGBA\")"
          astc_branch = "                    texture = obj.read()\n                    source_format = int(texture.m_TextureFormat)\n                    # ASTC is a cross-platform GPU format supported by modern iPhones.\n                    # Preserve its compressed bytes instead of decoding a large image on-device.\n                    if 48 <= source_format <= 59:\n                        self.stats.textures += 1\n                        continue\n                    image = texture.image.convert(\"RGBA\")"
          if texture_line in module:
              module = module.replace(texture_line, astc_branch, 1)
          elif astc_branch not in module:
              raise SystemExit("Could not add the low-memory ASTC texture path")
          old_validation = "                    if int(texture.m_TextureFormat) != int(TextureFormat.RGBA32):\n                        raise ConversionError(f\"Texture is not RGBA32: {texture.m_Name}\")"
          new_validation = "                    texture_format = int(texture.m_TextureFormat)\n                    if texture_format != int(TextureFormat.RGBA32) and not (48 <= texture_format <= 59):\n                        raise ConversionError(f\"Texture format is not iOS-ready: {texture.m_Name}\")\n                    if 48 <= texture_format <= 59:\n                        continue"
          if old_validation in module:
              module = module.replace(old_validation, new_validation, 1)
          elif new_validation not in module:
              raise SystemExit("Could not update texture validation for preserved ASTC")
          converter.write_text(module)

          # Install the lazy-import bridge last so earlier compatibility patches
          # cannot overwrite the crash fix.
          patched_bridge = Path("../../patches/converter_bridge.py")
          if not patched_bridge.is_file():
              raise SystemExit("Missing patches/converter_bridge.py")
          bridge.write_text(patched_bridge.read_text())
          PY
      - name: Avoid second embedded Python sys import hang
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Sources/PythonConverter.swift")
          source = path.read_text()
          lines = source.splitlines()
          output = []
          replaced = False
          for line in lines:
              if 'self.recordDiagnostic("SWIFT: importing Python sys module"' in line:
                  output.append('                self.recordDiagnostic("SWIFT: skipping second sys import; PYTHONPATH was set before initialization", outputDirectory: outputDirectory)')
                  replaced = True
                  continue
              if 'let sys = Python.import("sys")' in line:
                  replaced = True
                  continue
              if "sys.path" in line:
                  replaced = True
                  continue
              output.append(line)
          if not replaced:
              raise SystemExit("Could not find the second sys import/path setup to replace")
          source = "\n".join(output) + "\n"
          if 'let sys = Python.import("sys")' in source or "sys.path" in source:
              raise SystemExit("Second sys import/path references remain")
          path.write_text(source)
          print("Removed the second sys import; runtime PYTHONPATH is configured before interpreter initialization.")
          PY
      - name: Add converter bridge import checkpoints
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("Sources/PythonConverter.swift")
          source = path.read_text()

          # Always remove the unsupported Python.withGil calls if the project
          # archive or an earlier patch introduced them.
          source = source.replace('Python.withGil { Python.import("converter_bridge") }',
                                  'Python.import("converter_bridge")')
          source = source.replace('let raw = try Python.withGil { try bridge.run_conversion.throwing.dynamicallyCall(withArguments: [',
                                  'let raw = try bridge.run_conversion.throwing.dynamicallyCall(withArguments: [')
          source = source.replace('input.lastPathComponent\n                ]) }',
                                  'input.lastPathComponent\n                ])')

          bridge_line = '                let bridge = Python.import("converter_bridge")'
          throwing_bridge_line = '                let bridge = try Python.attemptImport("converter_bridge")'
          if bridge_line not in source and throwing_bridge_line not in source:
              raise SystemExit("Could not locate converter bridge import in PythonConverter.swift")

          # Python.import() is implemented with try! in PythonKit. A failed
          # import therefore traps the app before the existing Swift catch can
          # write the real error. Use the throwing API so import failures become
          # diagnostics instead of an immediate fatal crash.
          if bridge_line in source:
              source = source.replace(bridge_line, throwing_bridge_line, 1)

          if ('SWIFT: importing converter bridge' not in source and
                  'SWIFT: importing converter bridge and Unity dependencies' not in source):
              source = source.replace(throwing_bridge_line,
                  '                let bridgeDiagnosticPath = appRoot.appendingPathComponent("app/converter_bridge.py").path\n' +
                  '                self.recordDiagnostic("SWIFT: bridge file exists=\\(FileManager.default.fileExists(atPath: bridgeDiagnosticPath)); path=\\(bridgeDiagnosticPath)", outputDirectory: outputDirectory)\n' +
                  '                let bridgeDiagnosticPackagesPath = appRoot.appendingPathComponent("app_packages", isDirectory: true).path\n' +
                  '                self.recordDiagnostic("SWIFT: app_packages exists=\\(FileManager.default.fileExists(atPath: bridgeDiagnosticPackagesPath)); path=\\(bridgeDiagnosticPackagesPath)", outputDirectory: outputDirectory)\n' +
                  '                self.recordDiagnostic("SWIFT: importing converter bridge", outputDirectory: outputDirectory)\n' +
                  throwing_bridge_line + '\n' +
                  '                self.recordDiagnostic("SWIFT: converter bridge imported", outputDirectory: outputDirectory)', 1)
          if 'Python.import("converter_bridge")' in source:
              raise SystemExit("Unsafe non-throwing converter bridge import remains")
          if 'try Python.attemptImport("converter_bridge")' not in source:
              raise SystemExit("Throwing converter bridge import was not installed")

          call_line = '                let raw = try bridge.run_conversion.throwing.dynamicallyCall(withArguments: ['
          if call_line not in source:
              raise SystemExit("Could not locate converter bridge conversion call")
          if 'SWIFT: calling converter bridge' not in source:
              source = source.replace(call_line,
                  '                self.recordDiagnostic("SWIFT: calling converter bridge", outputDirectory: outputDirectory)\n' +
                  call_line, 1)

          if 'Python.withGil' in source:
              raise SystemExit("Unsupported Python.withGil call remains")
          path.write_text(source)
          print("Added bridge checkpoints and removed unsupported Python.withGil calls.")
          PY
      - name: Prevent reentrant conversion calls
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Sources/PythonConverter.swift")
          lines = path.read_text().splitlines()

          if "    private let conversionStateLock = NSLock()" not in lines:
              try:
                  index = lines.index("    private var initialized = false")
              except ValueError:
                  raise SystemExit("Could not find PythonConverter initialization state")
              lines[index + 1:index + 1] = [
                  "    private let conversionStateLock = NSLock()",
                  "    private var conversionInProgress = false",
              ]

          if "        guard !conversionInProgress else {" not in lines:
              try:
                  method_index = next(i for i, line in enumerate(lines) if line.startswith("    func convert(input: URL, outputDirectory: URL,"))
                  queue_index = next(i for i in range(method_index + 1, len(lines)) if lines[i] == "        queue.async {")
              except StopIteration:
                  raise SystemExit("Could not find PythonConverter.convert() entry point")
              lines[queue_index:queue_index] = [
                  "        conversionStateLock.lock()",
                  "        guard !conversionInProgress else {",
                  "            conversionStateLock.unlock()",
                  "            return",
                  "        }",
                  "        conversionInProgress = true",
                  "        conversionStateLock.unlock()",
                  "",
              ]
              queue_index = next(i for i in range(method_index + 1, len(lines)) if lines[i] == "        queue.async {")
              lines[queue_index + 1:queue_index + 1] = [
                  "            defer {",
                  "                self.conversionStateLock.lock()",
                  "                self.conversionInProgress = false",
                  "                self.conversionStateLock.unlock()",
                  "            }",
              ]

          if lines.count("    private let conversionStateLock = NSLock()") != 1:
              raise SystemExit("Duplicate conversion lock declaration detected")
          if "        guard !conversionInProgress else {" not in lines or "                self.conversionInProgress = false" not in lines:
              raise SystemExit("Repeat-conversion guard is incomplete")
          path.write_text(chr(10).join(lines) + chr(10))
          print("Installed a locked, non-reentrant Python conversion gate.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/converter_bridge.py")
          source = path.read_text()
          compile(source, str(path), "exec")
          for marker in (
              "converter = report = None",
              "post-conversion cleanup completed",
              "gc.collect()",
              "class _BoundedCapture:",
              "logs, capture = [], _BoundedCapture()",
              "self.jobs = _SpaceSavingJobs(self)",
              "owner._incrementally_validated.add(owner._job_key(job))",
              '.isha_shader_bundle_v3',
          ):
              if marker not in source:
                  raise SystemExit(f"Missing repeated-conversion memory fix: {marker}")
          import sys
          sys.path.insert(0, str(path.parent))
          import converter_bridge
          capture = converter_bridge._BoundedCapture(limit=64)
          capture.write("A" * 100)
          if capture.getvalue() != "A" * 64:
              raise SystemExit("Bounded diagnostic capture did not retain the expected tail")
          print("Verified Python bridge syntax, bounded output capture, incremental validation, and post-conversion cleanup.")
          PY
      - name: Pin embedded Python to one permanent worker thread
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/PythonConverter.swift")
          source = path.read_text()

          queue_decl = '    private let queue = DispatchQueue(label: "mlbb.converter.python", qos: .userInitiated)'
          if queue_decl in source:
              source = source.replace(
                  queue_decl,
                  '    private var pythonWorkerThread: Thread?\n'
                  '    private let pythonWorkerLock = NSLock()\n'
                  '    private let pythonWorkerReady = DispatchSemaphore(value: 0)',
                  1,
              )
          elif "private var pythonWorkerThread: Thread?" not in source:
              raise SystemExit("Could not find PythonConverter's DispatchQueue declaration")

          if "        queue.async {" in source:
              source = source.replace("        queue.async {", "        self.enqueueOnPythonThread {", 1)
          elif "self.enqueueOnPythonThread {" not in source:
              raise SystemExit("Could not find conversion work block to move onto the persistent Python thread")

          worker_class = """\
          private final class PythonWorkerItem: NSObject {
              private let work: () -> Void

              init(_ work: @escaping () -> Void) {
                  self.work = work
              }

              @objc fileprivate func execute() {
                  work()
              }
          }

          """
          if "private final class PythonWorkerItem: NSObject" not in source:
              source = source.replace("final class PythonConverter {", worker_class + "final class PythonConverter {", 1)

          methods = """\
              private func enqueueOnPythonThread(_ work: @escaping () -> Void) {
                  let thread: Thread
                  let shouldWaitForStartup: Bool

                  pythonWorkerLock.lock()
                  if let existing = pythonWorkerThread {
                      thread = existing
                      shouldWaitForStartup = false
                  } else {
                      let newThread = Thread { [weak self] in
                          self?.pythonWorkerMain()
                      }
                      newThread.name = "IshaConverter.PythonRuntime"
                      pythonWorkerThread = newThread
                      thread = newThread
                      shouldWaitForStartup = true
                      newThread.start()
                  }
                  pythonWorkerLock.unlock()

                  if shouldWaitForStartup {
                      pythonWorkerReady.wait()
                  }

                  let item = PythonWorkerItem(work)
                  item.perform(#selector(PythonWorkerItem.execute), on: thread, with: nil, waitUntilDone: false)
              }

              private func pythonWorkerMain() {
                  let keepAlivePort = Port()
                  RunLoop.current.add(keepAlivePort, forMode: .default)
                  pythonWorkerReady.signal()
                  while !Thread.current.isCancelled {
                      _ = RunLoop.current.run(mode: .default, before: Date.distantFuture)
                  }
              }

          """
          if "private func enqueueOnPythonThread(" not in source:
              anchor = "    private func initializeRuntime(outputDirectory: URL) throws {"
              if anchor not in source:
                  raise SystemExit("Could not find patched initializeRuntime(outputDirectory:) method")
              source = source.replace(anchor, methods + anchor, 1)

          if "        queue.async {" in source:
              raise SystemExit("DispatchQueue still wraps embedded Python operations")
          if 'private let queue = DispatchQueue(label: "mlbb.converter.python"' in source:
              raise SystemExit("Old Python DispatchQueue property remains")
          if "self.enqueueOnPythonThread {" not in source or "PythonWorkerItem.execute" not in source:
              raise SystemExit("Dedicated-thread dispatch markers are incomplete")
          if "pythonWorkerReady.signal()" not in source or "pythonWorkerReady.wait()" not in source:
              raise SystemExit("Dedicated Python thread startup synchronization is incomplete")

          path.write_text(source)
          print("Pinned Python runtime initialization, module imports, and conversion calls to one persistent OS thread.")
          PY
      - name: Verify Python runtime thread affinity
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("Sources/PythonConverter.swift").read_text()
          required = (
              "private var pythonWorkerThread: Thread?",
              "self.enqueueOnPythonThread {",
              "private func pythonWorkerMain()",
              "let keepAlivePort = Port()",
              "RunLoop.current.run(mode: .default, before: Date.distantFuture)",
              'Python.import("sys")',
              'try Python.attemptImport("converter_bridge")',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Missing Python thread-affinity protections: " + ", ".join(missing))
          if "queue.async {" in source:
              raise SystemExit("Python execution is still dispatched through a non-thread-affine queue")
          print("Verified embedded Python API calls run on a persistent thread rather than interchangeable GCD workers.")
          PY
      - name: Build unsigned iPhone app
        working-directory: reconstructed/MLBB_iOS_Converter
        run: xcodebuild -project IshaConverteriOS.xcodeproj -scheme IshaConverteriOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Bundle Python converter code, dependencies, and standard library
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/IshaConverteriOS.app"

          # PythonConverter.swift adds these exact two directories to PYTHONPATH
          # under Bundle.main.bundleURL. They must be copied into the built app;
          # building the Swift target alone does not put them in the app bundle.
          test -f "app/converter_bridge.py"
          test -f "app/mlbb_ios_converter.py"
          test -d "app_packages"

          # UnityPy eagerly imports AudioClipConverter from UnityPy.export.__init__.
          # That module imports fmod_toolkit at module load, although the iOS
          # converter only needs Texture2DConverter here. Keep FMOD optional:
          # normal imports/texture conversion work without it, and a true request
          # to decode unsupported FMOD audio reports a focused error.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app_packages/UnityPy/export/AudioClipConverter.py")
          source = path.read_text()
          eager_import = "import fmod_toolkit\n"
          optional_import = (
              "try:\n"
              "    import fmod_toolkit\n"
              "except ImportError:\n"
              "    fmod_toolkit = None\n"
          )
          if eager_import in source:
              source = source.replace(eager_import, optional_import, 1)
          elif "try:\n    import fmod_toolkit" not in source:
              raise SystemExit("Could not locate UnityPy's FMOD import to make optional")

          call = "return fmod_toolkit.raw_to_wav("
          guarded_call = (
              'if fmod_toolkit is None:\n'
              '        raise RuntimeError("FMOD audio decoding is unavailable in this iOS build.")\n'
              '    return fmod_toolkit.raw_to_wav('
          )
          if call in source:
              source = source.replace(call, guarded_call, 1)
          elif "FMOD audio decoding is unavailable in this iOS build." not in source:
              raise SystemExit("Could not guard UnityPy's FMOD decoding call")

          compile(source, str(path), "exec")
          path.write_text(source)
          print("Patched UnityPy AudioClipConverter: fmod_toolkit is optional on iOS.")
          PY

          rm -rf "$app/app" "$app/app_packages"
          ditto "app" "$app/app"
          ditto "app_packages" "$app/app_packages"

          test -f "$app/app/converter_bridge.py"
          test -f "$app/app/mlbb_ios_converter.py"
          test -d "$app/app_packages"
          echo "Verified converter bridge and package directories inside app bundle:"
          echo "  $app/app/converter_bridge.py"
          echo "  $app/app_packages"

          mkdir -p "$app/python"
          ditto python "$app/python"
          test -f "$app/python/lib/python3.14/encodings/__init__.py"
          test -d "$app/python/lib/python3.14/lib-dynload"
          test -f "$app/Assets.car"

          # Generate explicit legacy icon files as a fallback for bundle readers
          # that inspect CFBundleIconFiles. The primary app icon is registered
          # from the AppIcon asset catalog by Xcode, not by these files alone.
          icon_source="Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          test -f "$icon_source"
          sips -s format png -z 120 120 "$icon_source" --out "$app/AppIcon60x60@2x.png" >/dev/null
          sips -s format png -z 180 180 "$icon_source" --out "$app/AppIcon60x60@3x.png" >/dev/null
          sips -s format png -z 152 152 "$icon_source" --out "$app/AppIcon76x76@2x~ipad.png" >/dev/null
          sips -s format png -z 167 167 "$icon_source" --out "$app/AppIcon83.5x83.5@2x~ipad.png" >/dev/null

          python3 - <<'PY'
          import json
          import os
          import plistlib
          import struct
          from pathlib import Path
          app = Path("build/Build/Products/Release-iphoneos/IshaConverteriOS.app")
          data = plistlib.loads((app / "Info.plist").read_bytes())
          if data.get("CFBundleDisplayName") != "Isha Converter iOS":
              raise SystemExit(f"Wrong Home Screen name: {data.get('CFBundleDisplayName')}")
          if data.get("CFBundleVersion") != os.environ["GITHUB_RUN_NUMBER"]:
              raise SystemExit(f"Build number not updated: {data.get('CFBundleVersion')}")
          # Confirm Xcode registered the AppIcon asset catalog. Do not overwrite
          # CFBundleIcons manually: iOS relies on the asset-name registration, and
          # scale-independent CFBundleIconFiles base names for legacy bundle readers.
          if data.get("CFBundleIdentifier") != "com.isha.converter.ios":
              raise SystemExit(f"Wrong installed bundle ID: {data.get('CFBundleIdentifier')}")
          icons = data.get("CFBundleIcons", {})
          primary = icons.get("CFBundlePrimaryIcon", {})
          expected_iphone_files = ["AppIcon60x60"]
          if primary.get("CFBundleIconName") != "AppIcon":
              raise SystemExit(f"Xcode did not register AppIcon in the primary icon metadata: {primary}")
          if primary.get("CFBundleIconFiles") != expected_iphone_files:
              raise SystemExit(f"Unexpected iPhone CFBundleIconFiles; expected scale-independent base names {expected_iphone_files}: {primary}")
          ipad_icons = data.get("CFBundleIcons~ipad", {})
          ipad_primary = ipad_icons.get("CFBundlePrimaryIcon", {})
          expected_ipad_files = ["AppIcon60x60", "AppIcon76x76"]
          if ipad_primary.get("CFBundleIconName") != "AppIcon":
              raise SystemExit(f"Xcode did not register the iPad AppIcon: {ipad_primary}")
          if ipad_primary.get("CFBundleIconFiles") != expected_ipad_files:
              raise SystemExit(f"Unexpected iPad CFBundleIconFiles; expected base names {expected_ipad_files}: {ipad_primary}")
          print(f"Xcode-generated iPhone CFBundleIcons: {json.dumps(icons, sort_keys=True)}")
          print(f"Xcode-generated iPad CFBundleIcons~ipad: {json.dumps(ipad_icons, sort_keys=True)}")
          icon_files = [
              ("AppIcon60x60@2x.png", 120, 120),
              ("AppIcon60x60@3x.png", 180, 180),
              ("AppIcon76x76@2x~ipad.png", 152, 152),
              ("AppIcon83.5x83.5@2x~ipad.png", 167, 167),
          ]
          for filename, expected_width, expected_height in icon_files:
              path = app / filename
              if not path.is_file() or path.stat().st_size < 2048:
                  raise SystemExit(f"App icon is missing or suspiciously small: {path}")
              image = path.read_bytes()
              if image[:4] != bytes([137, 80, 78, 71]):
                  raise SystemExit(f"App icon is not PNG: {path}")
              width, height = struct.unpack(">II", image[16:24])
              if (width, height) != (expected_width, expected_height):
                  raise SystemExit(f"Wrong dimensions for {filename}: {width}x{height}")
          if not (app / "Assets.car").is_file():
              raise SystemExit("Compiled app icon catalog is missing")
          print(f"Verified fresh Isha bundle ID {data['CFBundleIdentifier']}, Xcode-generated AppIcon metadata with scale-independent file names, and resolution variants: {', '.join(name for name, _, _ in icon_files)}.")
          PY
          echo "Verified embedded Python standard library at $app/python/lib/python3.14"
      - name: Package IPA
        working-directory: reconstructed/MLBB_iOS_Converter
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/IshaConverteriOS.app package/Payload/
          ditto -c -k --sequesterRsrc --keepParent package/Payload Isha_Converter_iOS.ipa

          # Validate the final IPA, not only the pre-archive app bundle.
          python3 - <<'PY'
          import plistlib
          import struct
          import zipfile
          ipa = "Isha_Converter_iOS.ipa"
          root = "Payload/IshaConverteriOS.app/"
          with zipfile.ZipFile(ipa) as z:
              plist = plistlib.loads(z.read(root + "Info.plist"))
              if plist.get("CFBundleDisplayName") != "Isha Converter iOS":
                  raise SystemExit("Final IPA has the wrong display name")
              if plist.get("CFBundleIdentifier") != "com.isha.converter.ios":
                  raise SystemExit(f"Final IPA has the old/unexpected bundle ID: {plist.get('CFBundleIdentifier')}")
              primary = plist.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {})
              expected = ["AppIcon60x60"]
              if primary.get("CFBundleIconName") != "AppIcon" or primary.get("CFBundleIconFiles") != expected:
                  raise SystemExit(f"Final IPA has incorrect Xcode app icon metadata: {primary}")
              ipad_primary = plist.get("CFBundleIcons~ipad", {}).get("CFBundlePrimaryIcon", {})
              if ipad_primary.get("CFBundleIconName") != "AppIcon" or ipad_primary.get("CFBundleIconFiles") != ["AppIcon60x60", "AppIcon76x76"]:
                  raise SystemExit(f"Final IPA has incorrect iPad icon metadata: {ipad_primary}")
              for filename, width, height in [
                  ("AppIcon60x60@2x.png", 120, 120),
                  ("AppIcon60x60@3x.png", 180, 180),
              ]:
                  raw = z.read(root + filename)
                  if raw[:4] != bytes([137, 80, 78, 71]):
                      raise SystemExit(f"Final IPA icon is not PNG: {filename}")
                  actual = struct.unpack(">II", raw[16:24])
                  if actual != (width, height):
                      raise SystemExit(f"Final IPA icon dimensions wrong: {filename}: {actual}")
              print("Verified final IPA has a fresh bundle ID, Xcode AppIcon registration, and correctly named 2x/3x custom PNGs.")
              print(f"Final IPA primary icon metadata: {primary}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Isha_Converter_iOS
          path: reconstructed/MLBB_iOS_Converter/Isha_Converter_iOS.ipa
          if-no-files-found: error
