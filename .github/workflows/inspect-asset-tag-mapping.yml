name: Inspect converter source for asset mapping
on:
  push:
    branches:
      - inspect-asset-tag-mapping
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble project source
        run: |
          set -euo pipefail
          cat MLBB_iOS_Converter_Project.zip.part* > MLBB_iOS_Converter_Project.zip
          unzip -q MLBB_iOS_Converter_Project.zip -d reconstructed
          test -d reconstructed/MLBB_iOS_Converter
      - name: Collect source files needed for asset mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          root = Path("reconstructed/MLBB_iOS_Converter")
          out = Path("source_inspection")
          out.mkdir(exist_ok=True)
          allowed = {".swift", ".py", ".json", ".plist", ".toml", ".txt"}
          for base in (root / "Sources", root / "app", root / "app_packages" / "UnityPy"):
              if not base.exists():
                  continue
              for src in base.rglob("*"):
                  if not src.is_file():
                      continue
                  if base.name == "Sources" and src.suffix != ".swift":
                      continue
                  if base.name == "UnityPy" and src.suffix != ".py":
                      continue
                  if base.name == "app" and src.suffix not in allowed:
                      continue
                  rel = src.relative_to(root)
                  dest = out / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)
          inventory = []
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  inventory.append(f"{p.relative_to(root)}\t{p.stat().st_size} bytes")
          (out / "source_inventory.txt").write_text("\n".join(inventory), encoding="utf-8")
          matches = []
          terms = ("run_conversion", "converter_bridge", "isha.gameLook.skinTags",
                   "SkinTagReplacementRule", "Atlas_SkinCollectQuality", "UI_SkinCardQuality")
          for p in sorted(out.rglob("*")):
              if p.is_file() and p.suffix in {".swift", ".py", ".json", ".txt"}:
                  try:
                      content = p.read_text(encoding="utf-8", errors="replace")
                  except Exception:
                      continue
                  for number, line in enumerate(content.splitlines(), 1):
                      if any(t.lower() in line.lower() for t in terms):
                          matches.append(f"{p}:{number}:{line}")
          (out / "relevant_matches.txt").write_text("\n".join(matches), encoding="utf-8")
          with zipfile.ZipFile("source_inspection.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for p in out.rglob("*"):
                  if p.is_file():
                      z.write(p, p.as_posix())
          print(f"Exported {sum(1 for p in out.rglob('*') if p.is_file())} source/inventory files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Isha_Source_Inspection
          path: source_inspection.zip
          if-no-files-found: error
          retention-days: 14
